<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#F7F3EC" />
  <title>Activa tu acceso — English Coach</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#243447;background:#f7f3ec;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,440px);background:#fff;border:1px solid #e9e2d7;border-radius:24px;padding:32px;box-shadow:0 18px 50px #33415512}
    h1{margin:0 0 10px;font-size:1.65rem}p{line-height:1.55;color:#526174}.field{display:grid;gap:7px;margin:18px 0;font-weight:600;font-size:.92rem}
    input{font:inherit;padding:13px 14px;border:1px solid #cbd5e1;border-radius:12px;width:100%}button,.link{display:inline-flex;justify-content:center;width:100%;padding:13px 16px;border:0;border-radius:12px;background:#174f46;color:white;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}.status{min-height:26px;font-size:.92rem;color:#9a3412}.status.ok{color:#166534}.small{font-size:.83rem}
  </style>
  <script src="./config.js"></script>
</head>
<body>
  <main>
    <h1>Activa tu acceso</h1>
    <p>Elige una contraseña para entrar en English Coach. Usa al menos 8 caracteres.</p>
    <form id="form">
      <label class="field">Nueva contraseña<input id="password" type="password" minlength="8" autocomplete="new-password" required /></label>
      <label class="field">Repite la contraseña<input id="confirm" type="password" minlength="8" autocomplete="new-password" required /></label>
      <button id="submit" type="submit">Guardar contraseña</button>
    </form>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p class="small">Este enlace es personal y de un solo uso. Si ha caducado, pide que te envíen una nueva invitación.</p>
  </main>
  <script>
    const statusEl = document.querySelector('#status');
    const form = document.querySelector('#form');
    const button = document.querySelector('#submit');
    const config = window.__EFM_CONFIG__ || {};
    const params = new URLSearchParams(location.hash.slice(1));
    const accessToken = params.get('access_token');
    const authError = params.get('error_description');
    if (authError) statusEl.textContent = 'El enlace ha caducado o no es válido. Solicita una invitación nueva.';
    if (!accessToken && !authError) statusEl.textContent = 'Abre esta página desde el enlace de invitación que recibiste por correo.';
    if (accessToken) history.replaceState(null, '', location.pathname);
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.querySelector('#password').value;
      if (!accessToken) { statusEl.textContent = 'Falta un enlace de invitación válido.'; return; }
      if (password !== document.querySelector('#confirm').value) { statusEl.textContent = 'Las contraseñas no coinciden.'; return; }
      button.disabled = true;
      statusEl.textContent = 'Guardando…';
      try {
        const response = await fetch(`${config.SUPABASE_URL}/auth/v1/user`, {
          method: 'PUT',
          headers: { apikey: config.SUPABASE_ANON_KEY, authorization: `Bearer ${accessToken}`, 'content-type': 'application/json' },
          body: JSON.stringify({ password })
        });
        if (!response.ok) throw new Error('No se pudo guardar la contraseña. El enlace puede haber caducado.');
        form.hidden = true;
        statusEl.classList.add('ok');
        statusEl.textContent = 'Contraseña guardada. Ya puedes entrar en la app.';
        const link = document.createElement('a');
        link.className = 'link'; link.href = './'; link.textContent = 'Ir a English Coach';
        form.after(link);
      } catch (error) {
        statusEl.textContent = error.message || 'No se pudo activar el acceso. Solicita una invitación nueva.';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
